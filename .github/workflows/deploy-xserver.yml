name: Deploy to Xserver

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_GA4_ID: ${{ secrets.PUBLIC_GA4_ID }}

      - name: Smoke test tracking tags
        run: |
          set -euo pipefail
          fail=0
          check() {
            local file="$1" pattern="$2" expected="$3" label="$4"
            local n
            n=$(grep -c -- "$pattern" "$file" || true)
            if [ "$n" -lt "$expected" ]; then
              echo "::error::$file: $label が $expected 個以上あるはずが $n 個"
              fail=1
            fi
          }
          for page in dist/insta-auto/index.html dist/insta-auto/apply/index.html; do
            check "$page" "googletagmanager.com/gtag/js?id=G-" 1 "GA4タグ"
            check "$page" "fbq('init'" 1 "Metaピクセル"
            # init が2つ以上あると全イベントが二重計上される
            n=$(grep -c -- "fbq('init'" "$page" || true)
            if [ "$n" -gt 1 ]; then
              echo "::error::$page: fbq('init') が $n 個ある（二重計上になる）"
              fail=1
            fi
          done
          check dist/insta-auto/apply/index.html "omakasegram-apply" 1 "申込イベント"
          check dist/insta-auto/index.html "omakasegram-contact" 1 "相談イベント"
          [ "$fail" -eq 0 ] || { echo "計測タグが欠けているためデプロイを中止します"; exit 1; }
          echo "✅ 計測タグのスモークテスト通過"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.XSERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Backup current site on server
        run: |
          ssh -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} '
            DOCROOT=~/sai-mon.co.jp/public_html
            BACKUP=~/sai-mon.co.jp/backup_$(date +%Y%m%d_%H%M%S)
            if [ -d "$DOCROOT" ] && [ "$(ls -A $DOCROOT 2>/dev/null)" ]; then
              cp -a "$DOCROOT" "$BACKUP"
              # 直近3世代のみ保持
              ls -dt ~/sai-mon.co.jp/backup_* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true
            fi
          '

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.XSERVER_PORT }}" \
            ./dist/ \
            ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}:~/sai-mon.co.jp/public_html/
