<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<!-- EDIT: sai-mon.co.jp の既定OGP画像（1200x630）。出力先 public/og-image.png（src/data/seo.ts の defaultOgImage） -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    font-feature-settings: "palt";
    color: #fff;
    background: #0d0084;
  }
  h1, p { text-wrap: balance; word-break: auto-phrase; }
  /* 方眼の地模様（右側だけ） */
  .grid {
    position: absolute;
    inset: 0 0 0 52%;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 45%);
    mask-image: linear-gradient(90deg, transparent, #000 45%);
  }
  /* 右側の大きな透かし文字 */
  .ghost {
    position: absolute;
    right: -30px;
    bottom: -70px;
    font-family: Inter, sans-serif;
    font-weight: 900;
    font-size: 330px;
    line-height: 1;
    letter-spacing: -0.04em;
    color: transparent;
    -webkit-text-stroke: 2px rgba(255, 255, 255, 0.12);
  }
  .accent { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #31b9b5; }
  .inner { position: absolute; inset: 64px 80px 56px 92px; display: flex; flex-direction: column; }
  .logo { font-family: Inter, sans-serif; font-weight: 900; font-size: 46px; letter-spacing: -0.01em; line-height: 1; }
  .logo span { color: #4d9dff; }
  .main { margin-top: auto; }
  h1 { font-size: 64px; font-weight: 900; line-height: 1.32; letter-spacing: 0.01em; white-space: nowrap; }
  h1 em { font-style: normal; color: #4dd4d0; }
  .lead { margin-top: 20px; font-size: 25px; font-weight: 500; color: rgba(255, 255, 255, 0.82); white-space: nowrap; }
  .pillars { display: flex; gap: 14px; margin-top: 36px; }
  .pillar {
    display: flex;
    align-items: baseline;
    gap: 12px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 12px 20px;
    white-space: nowrap;
  }
  .pillar small { font-size: 17px; font-weight: 700; color: rgba(255, 255, 255, 0.7); }
  .pillar b { font-size: 24px; font-weight: 900; }
  .url { position: absolute; right: 80px; top: 72px; font-family: Inter, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.04em; color: rgba(255, 255, 255, 0.62); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="ghost">AI</div>
  <div class="accent"></div>
  <p class="url">sai-mon.co.jp</p>
  <div class="inner">
    <p class="logo">S<span>AI</span>MON</p>
    <div class="main">
      <h1>社内に<em>育てる</em>研修も、<br />プロに<em>任せる</em>制作も。</h1>
      <p class="lead">企業の“つくる力”を支援する、株式会社SAIMON</p>
      <div class="pillars">
        <div class="pillar"><small>企業向けAI研修</small><b>AI IMPACT LAB</b></div>
        <div class="pillar"><small>月額定額デザイン</small><b>サブスクデザイン</b></div>
      </div>
    </div>
  </div>
</body>
</html>
